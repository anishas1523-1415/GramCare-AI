version: '3.8'

services:
  # 1. Unified Web Portal (Next.js for Patient Suite & Doctor Portal)
  web_portal:
    build:
      context: ./apps/web_portal
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined at BUILD time. They were previously
      # passed as runtime environment (no effect on client bundles) and were
      # missing the /api/v1 suffix, so the containerized portal only worked
      # by accident of in-code fallbacks.
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
        - NEXT_PUBLIC_WS_URL=http://localhost:4000
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
    container_name: gramcare_web_portal
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      fastapi_backend:
        condition: service_healthy
      node_signaling:
        condition: service_healthy
    networks:
      - gramcare_net

  # 2. Pharmacy Portal (Vite/React Dashboard)
  pharmacy_portal:
    build:
      context: ./apps/react_dashboard
      dockerfile: Dockerfile
      # VITE_* values are inlined at BUILD time (see Dockerfile note).
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    container_name: gramcare_pharmacy_portal
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      fastapi_backend:
        condition: service_healthy
    networks:
      - gramcare_net

  # 3. Node.js Realtime Signaling Engine (Socket.io + WebRTC)
  node_signaling:
    build:
      context: ./backend/node_api
      dockerfile: Dockerfile
    container_name: gramcare_node_signaling
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FASTAPI_URL=http://fastapi_backend:8000
      # Must match apps/backend_service's JWT_SECRET_KEY (see that service's
      # env_file below) so tokens minted by FastAPI validate here too. This
      # used to read a different variable (SECRET_KEY) with a different
      # default, so cross-service auth silently never worked.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-gramcare_jwt_secret_change_this_in_production_2026}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80,http://web_portal:3000,http://pharmacy_portal:80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - gramcare_net

  # 4. FastAPI Backend
  fastapi_backend:
    build:
      context: ./apps/backend_service
      dockerfile: Dockerfile
    container_name: gramcare_fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend_service/.env
    environment:
      - DATABASE_URL=postgresql://gramcare_user:${POSTGRES_PASSWORD:-securepassword123}@postgres_db:5432/gramcare_db
      # In the containerized deployment, silently falling back to SQLite is
      # strictly worse than failing to start: the fallback file lives inside
      # the container's ephemeral filesystem and is lost on every rebuild.
      # Fail fast instead so a misconfigured DB is caught immediately.
      - ALLOW_SQLITE_FALLBACK=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - gramcare_net

  # 5. PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    container_name: gramcare_postgres
    environment:
      POSTGRES_USER: gramcare_user
      # Previously hardcoded to the literal "securepassword123" here AND in
      # fastapi_backend's DATABASE_URL above, committed in plaintext to
      # source control. Now reads from a POSTGRES_PASSWORD env var (e.g. a
      # local, gitignored .env at the repo root, or a real secret in
      # production), falling back to the old value only so `docker compose
      # up` still works out-of-the-box for local dev without extra setup —
      # this fallback MUST be overridden for any real deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
      POSTGRES_DB: gramcare_db
    # Postgres is intentionally NOT exposed to the host (attack-surface
    # reduction) — services reach it over the internal network. For local
    # debugging, uncomment:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramcare_user -d gramcare_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - gramcare_net

volumes:
  pgdata:

networks:
  gramcare_net:
    driver: bridge
