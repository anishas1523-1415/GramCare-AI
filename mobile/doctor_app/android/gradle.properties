# Was -Xmx8G — see patient_app/android/gradle.properties for the full
# explanation: the host has only ~7.5G physical RAM total, so that setting
# alone guaranteed an OOM crash of the Gradle daemon mid-build, confirmed
# via the JVM's own hs_err_pid*.log crash report.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Same cross-drive-root Kotlin incremental-cache crash as patient_app's
# gradle.properties (project on D:, pub cache on C:) — see that file's
# comment for the full explanation.
kotlin.incremental=false
