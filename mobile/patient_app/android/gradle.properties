# Was -Xmx8G — on a host with only ~7.5G of PHYSICAL RAM total, that alone
# exceeds all available memory before the OS, Kotlin daemon, D8/R8, or
# anything else gets a share. Confirmed via the JVM's own crash log
# (hs_err_pid*.log): "insufficient memory ... Native memory allocation
# (mmap) failed ... Host: ... 7G". Every release build was silently
# OOM-crashing the Gradle daemon mid-build — this had nothing to do with
# the app's source and would keep happening regardless of what changed in
# Dart/Kotlin code.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on D: while the pub cache lives on C: (default Windows
# install location) — Kotlin's incremental compiler tries to relativize
# paths between the two and throws "this and base files have different
# roots" on every single plugin with Kotlin sources (firebase_analytics,
# flutter_tts, image_picker_android, google_maps_flutter_android,
# speech_to_text, ...), forcing a slow non-incremental fallback recompile
# each time. Disabling incremental compilation avoids the crash path
# entirely — slightly slower per-build, but no wasted fallback attempts.
kotlin.incremental=false
