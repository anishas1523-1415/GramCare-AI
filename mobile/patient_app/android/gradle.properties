org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on D: while the pub cache lives on C: (default Windows
# install location) — Kotlin's incremental compiler tries to relativize
# paths between the two and throws "this and base files have different
# roots" on every single plugin with Kotlin sources (firebase_analytics,
# flutter_tts, image_picker_android, google_maps_flutter_android,
# speech_to_text, ...), forcing a slow non-incremental fallback recompile
# each time. Disabling incremental compilation avoids the crash path
# entirely — slightly slower per-build, but no wasted fallback attempts.
kotlin.incremental=false
