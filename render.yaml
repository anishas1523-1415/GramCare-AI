services:
  # 1. FastAPI Backend
  - type: web
    name: gramcare-fastapi
    env: python
    # NOTE: the free plan SLEEPS after inactivity — unacceptable for a
    # platform whose premise is emergency response. Upgrade to a paid plan
    # before any pilot with real patients.
    plan: free
    rootDir: apps/backend_service
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL connection string (incl. ?sslmode=require) — set in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in the Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://gramcare-portal.onrender.com,https://gramcare-pharmacy.onrender.com
      - key: NODE_SIGNALING_URL
        value: "https://gramcare-signaling.onrender.com"

  # 2. Node.js Realtime Signaling Server
  - type: web
    name: gramcare-signaling
    env: node
    plan: free
    rootDir: backend/node_api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: FASTAPI_URL
        value: "https://gramcare-fastapi.onrender.com"
      - key: JWT_SECRET_KEY
        sync: false # MUST equal gramcare-fastapi's JWT_SECRET_KEY
      - key: ALLOWED_ORIGINS
        sync: false # comma-separated production frontend origins
      - key: TURN_URL
        sync: false # e.g. turn:turn.example.com:3478 (coturn / Twilio NTS)
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false


