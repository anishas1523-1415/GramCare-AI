services:
  # 1. FastAPI Backend
  - type: web
    name: gramcare-fastapi
    env: python
    # NOTE: the free plan SLEEPS after inactivity — unacceptable for a
    # platform whose premise is emergency response. Upgrade to a paid plan
    # before any pilot with real patients.
    plan: free
    rootDir: backend/python_service
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL connection string (incl. ?sslmode=require) — set in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in the Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://gramcare-portal.onrender.com,https://gramcare-pharmacy.onrender.com
      - key: NODE_SIGNALING_URL
        value: "https://gramcare-signaling.onrender.com"

  # 2. Node.js Realtime Signaling Server
  - type: web
    name: gramcare-signaling
    env: node
    plan: free
    rootDir: backend/node_service
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: FASTAPI_URL
        value: "https://gramcare-fastapi.onrender.com"
      - key: JWT_SECRET_KEY
        sync: false # MUST equal gramcare-fastapi's JWT_SECRET_KEY
      - key: ALLOWED_ORIGINS
        sync: false # comma-separated production frontend origins
      - key: TURN_URL
        sync: false # e.g. turn:turn.example.com:3478 (coturn / Twilio NTS)
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # 3. Lab Portal (LAB role)
  #
  # The only surface the LAB role has: login/onboarding, the test catalog,
  # bookings, and report upload (frontend/lab_portal). It was never declared
  # here, and gramcare-lab.onrender.com does not respond — so labs currently
  # have no way in at all, even though the app itself is complete and the
  # backend's /lab endpoints are live.
  #
  # NOTE: the patient web portal and the pharmacist dashboard are
  # deliberately NOT declared here — those are already deployed and
  # configured outside this blueprint; adding them would fight their
  # existing setup.
  #
  # The pharmacist dashboard (Render static site "gramcare-pharmacy")
  # silently froze at its 2026-07-08 build because its settings still
  # pointed at apps/react_dashboard/, a path this repo no longer has:
  # Render only auto-deploys changes inside the root directory, so every
  # later commit was ignored. Its settings are now, and must stay:
  #   Root Directory:    (empty — npm workspaces resolve from the repo root)
  #   Build Command:     npm install && npm -w react_dashboard run build
  #   Publish Directory: frontend/admin_dashboard/dist
  # No env vars: src/lib/api.ts already defaults to the production API.
  # Use `npm install`, not `npm ci`: package-lock.json is gitignored on
  # purpose (see .gitignore), so there is no lockfile to install from.
  - type: web
    name: gramcare-lab
    env: node
    plan: free
    rootDir: frontend/lab_portal
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: "https://gramcare-fastapi.onrender.com/api/v1"


