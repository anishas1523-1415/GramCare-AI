name: GramCare AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gramcare_user
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: gramcare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      working-directory: ./apps/backend_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run Backend Tests
      working-directory: ./apps/backend_service
      env:
        DATABASE_URL: postgresql://gramcare_user:securepassword123@localhost:5432/gramcare_db
        # The app reads JWT_SECRET_KEY (not SECRET_KEY); the old name was a
        # no-op that silently left CI running on the hardcoded default.
        JWT_SECRET_KEY: test-secret-key-ci-only
        GEMINI_API_KEY: mock-api-key
      run: |
        pytest tests/

  build-web-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './apps/web_portal/package-lock.json'
        
    - name: Install & Build
      working-directory: ./apps/web_portal
      run: |
        npm install
        npm run build
        
  build-pharmacy-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './apps/react_dashboard/package-lock.json'
        
    - name: Install & Build
      working-directory: ./apps/react_dashboard
      run: |
        npm install
        npm run build

  build-mobile-apps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        
    - name: Build Patient App APK
      working-directory: ./apps/mobile_app
      run: |
        flutter pub get
        flutter build apk --release
        
    - name: Build Doctor App APK
      working-directory: ./apps/doctor_mobile_app
      run: |
        flutter pub get
        flutter build apk --release
        
    - name: Build Pharmacy App APK
      working-directory: ./apps/pharmacy_mobile_app
      run: |
        flutter pub get
        flutter build apk --release
        
    - name: Upload Patient APK
      uses: actions/upload-artifact@v4
      with:
        name: patient-app-apk
        path: apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload Doctor APK
      uses: actions/upload-artifact@v4
      with:
        name: doctor-app-apk
        path: apps/doctor_mobile_app/build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload Pharmacy APK
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-apk
        path: apps/pharmacy_mobile_app/build/app/outputs/flutter-apk/app-release.apk
