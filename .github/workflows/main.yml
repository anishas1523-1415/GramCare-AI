name: GramCare AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gramcare_user
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: gramcare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      working-directory: ./apps/backend_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run Backend Tests
      working-directory: ./apps/backend_service
      env:
        DATABASE_URL: postgresql://gramcare_user:securepassword123@localhost:5432/gramcare_db
        # The app reads JWT_SECRET_KEY (not SECRET_KEY); the old name was a
        # no-op that silently left CI running on the hardcoded default.
        JWT_SECRET_KEY: test-secret-key-ci-only
        GEMINI_API_KEY: mock-api-key
      run: |
        pytest tests/

  # web_portal, react_dashboard, and lab_portal are npm workspaces sharing
  # one root package-lock.json (see /package.json) since they all depend on
  # the internal @gramcare/api-client package — `npm install` has to run
  # from the repo root so that workspace link resolves, then each app
  # builds from its own directory using what root install already linked.
  build-web-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package.json'

    # package-lock.json isn't committed (see .gitignore) — a lockfile only
    # records the optional native-binary variants (lightningcss, rolldown)
    # resolved on whichever machine generated it, so a Windows-built one is
    # missing the Linux entries these packages need. This broke every
    # Vercel deploy and GitHub Actions run after the npm-workspaces
    # migration. No lockfile means npm always resolves fresh against
    # package.json's version ranges on whichever platform is actually
    # building, so it gets the right binary every time.
    - name: Install workspace dependencies
      run: npm install

    - name: Build
      working-directory: ./apps/web_portal
      run: npm run build

  build-pharmacy-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package.json'

    # package-lock.json isn't committed (see .gitignore) — see build-web-portal
    # above for why.
    - name: Install workspace dependencies
      run: npm install

    - name: Build
      working-directory: ./apps/react_dashboard
      run: npm run build

  build-lab-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package.json'

    # package-lock.json isn't committed (see .gitignore) — see build-web-portal
    # above for why.
    - name: Install workspace dependencies
      run: npm install

    - name: Build
      working-directory: ./apps/lab_portal
      run: npm run build

  build-mobile-apps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        
    # --release requires a signing keystore (SigningConfig "release" needs
    # storeFile) that doesn't exist in this repo or as a CI secret yet —
    # generating and wiring up real release-signing credentials is a
    # separate decision (it matters for future Play Store updates), not
    # something to invent here. --debug needs no signing and produces a
    # real installable APK in the meantime.
    - name: Build Patient App APK
      working-directory: ./apps/mobile_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Build Doctor App APK
      working-directory: ./apps/doctor_mobile_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Build Pharmacy App APK
      working-directory: ./apps/pharmacy_mobile_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Upload Patient APK
      uses: actions/upload-artifact@v4
      with:
        name: patient-app-apk
        path: apps/mobile_app/build/app/outputs/flutter-apk/app-debug.apk

    - name: Upload Doctor APK
      uses: actions/upload-artifact@v4
      with:
        name: doctor-app-apk
        path: apps/doctor_mobile_app/build/app/outputs/flutter-apk/app-debug.apk

    - name: Upload Pharmacy APK
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-apk
        path: apps/pharmacy_mobile_app/build/app/outputs/flutter-apk/app-debug.apk
