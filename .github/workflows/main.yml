name: GramCare AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gramcare_user
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: gramcare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      working-directory: ./apps/backend_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run Backend Tests
      working-directory: ./apps/backend_service
      env:
        DATABASE_URL: postgresql://gramcare_user:securepassword123@localhost:5432/gramcare_db
        # The app reads JWT_SECRET_KEY (not SECRET_KEY); the old name was a
        # no-op that silently left CI running on the hardcoded default.
        JWT_SECRET_KEY: test-secret-key-ci-only
        GEMINI_API_KEY: mock-api-key
      run: |
        pytest tests/

  # web_portal, react_dashboard, and lab_portal are npm workspaces sharing
  # one root package-lock.json (see /package.json) since they all depend on
  # the internal @gramcare/api-client package — `npm install` has to run
  # from the repo root so that workspace link resolves, then each app
  # builds from its own directory using what root install already linked.
  build-web-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    # package-lock.json was generated locally on Windows. lightningcss/
    # rolldown ship per-platform native binaries as optionalDependencies,
    # and npm only writes a lockfile `packages` entry for the platform
    # variants it actually resolved on the generating machine — Windows
    # here, so the Linux entry (e.g. lightningcss-linux-x64-gnu) is simply
    # absent from the committed lockfile, not just "not installed". No
    # amount of retrying `npm install` against that lockfile can fetch an
    # entry that was never written. Deleting the lockfile before install
    # (CI-runner-only — never pushed back) makes CI resolve fresh against
    # package.json's version ranges on its own platform instead.
    - name: Install workspace dependencies
      run: |
        rm -f package-lock.json
        npm install

    - name: Build
      working-directory: ./apps/web_portal
      run: npm run build

  build-pharmacy-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    # package-lock.json was generated locally on Windows. lightningcss/
    # rolldown ship per-platform native binaries as optionalDependencies,
    # and npm only writes a lockfile `packages` entry for the platform
    # variants it actually resolved on the generating machine — Windows
    # here, so the Linux entry (e.g. lightningcss-linux-x64-gnu) is simply
    # absent from the committed lockfile, not just "not installed". No
    # amount of retrying `npm install` against that lockfile can fetch an
    # entry that was never written. Deleting the lockfile before install
    # (CI-runner-only — never pushed back) makes CI resolve fresh against
    # package.json's version ranges on its own platform instead.
    - name: Install workspace dependencies
      run: |
        rm -f package-lock.json
        npm install

    - name: Build
      working-directory: ./apps/react_dashboard
      run: npm run build

  build-lab-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    # package-lock.json was generated locally on Windows. lightningcss/
    # rolldown ship per-platform native binaries as optionalDependencies,
    # and npm only writes a lockfile `packages` entry for the platform
    # variants it actually resolved on the generating machine — Windows
    # here, so the Linux entry (e.g. lightningcss-linux-x64-gnu) is simply
    # absent from the committed lockfile, not just "not installed". No
    # amount of retrying `npm install` against that lockfile can fetch an
    # entry that was never written. Deleting the lockfile before install
    # (CI-runner-only — never pushed back) makes CI resolve fresh against
    # package.json's version ranges on its own platform instead.
    - name: Install workspace dependencies
      run: |
        rm -f package-lock.json
        npm install

    - name: Build
      working-directory: ./apps/lab_portal
      run: npm run build

  build-mobile-apps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        
    # --release requires a signing keystore (SigningConfig "release" needs
    # storeFile) that doesn't exist in this repo or as a CI secret yet —
    # generating and wiring up real release-signing credentials is a
    # separate decision (it matters for future Play Store updates), not
    # something to invent here. --debug needs no signing and produces a
    # real installable APK in the meantime.
    - name: Build Patient App APK
      working-directory: ./apps/mobile_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Build Doctor App APK
      working-directory: ./apps/doctor_mobile_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Build Pharmacy App APK
      working-directory: ./apps/pharmacy_mobile_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Upload Patient APK
      uses: actions/upload-artifact@v4
      with:
        name: patient-app-apk
        path: apps/mobile_app/build/app/outputs/flutter-apk/app-debug.apk

    - name: Upload Doctor APK
      uses: actions/upload-artifact@v4
      with:
        name: doctor-app-apk
        path: apps/doctor_mobile_app/build/app/outputs/flutter-apk/app-debug.apk

    - name: Upload Pharmacy APK
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-app-apk
        path: apps/pharmacy_mobile_app/build/app/outputs/flutter-apk/app-debug.apk
